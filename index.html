<!DOCTYPE html>
<html lang="bn"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Royal Sales HR</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script src="idcard.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--blue:#283891;--navy:#0F1F4D;--orange:#F15A29;--ink:#0F172A;--mute:#5B6577;--line:#E3E7EF;--bg:#F4F6FA}
*{box-sizing:border-box}
body{margin:0;font-family:'Noto Sans Bengali','Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink)}
a{color:var(--blue)}
.hide{display:none!important}
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:28px;max-width:380px;width:100%;text-align:center}
.box h1{margin:12px 0 4px;font-size:22px;color:var(--blue)}
.box p{color:var(--mute);font-size:14px;margin:0 0 20px}
#gbtn{display:flex;justify-content:center;min-height:44px}
#lerr{color:#9B1C1C;font-size:14px;margin-top:14px}
.logo{width:56px;height:56px;object-fit:contain}
#app{display:flex;flex-wrap:wrap;min-height:100vh}
nav{flex:1 1 240px;max-width:270px;background:var(--navy);color:#fff;padding:20px 14px;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:12px;padding:4px 10px 18px}
.brand .lg{width:44px;height:44px;border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.brand .lg img{width:36px;height:36px;object-fit:contain}
.brand b{font-size:19px;display:block}.brand small{color:#C9D3F0;font-size:12px}
nav a{display:block;padding:11px 12px;border-radius:10px;color:#C9D3F0;text-decoration:none;font-size:15px}
nav a.on{background:var(--orange);color:var(--ink);font-weight:700}
nav a.soon{opacity:.5;pointer-events:none}
nav a.soon::after{content:' · শীঘ্রই';font-size:11px}
.me{margin-top:auto;padding:12px 10px 0;font-size:13px;color:#C9D3F0;border-top:1px solid #2a3c78}
.me button{margin-top:8px;min-height:44px;width:100%;border:1px solid #C9D3F0;background:transparent;color:#fff;border-radius:10px;font-weight:600;font-size:14px;font-family:inherit}
main{flex:999 1 560px;min-width:0;padding:28px 32px}
h1.t{margin:0 0 4px;font-size:28px}.sub{color:var(--mute);font-size:14px;margin-bottom:20px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:20px}
.card h2{margin:0 0 12px;font-size:18px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:640px}
th{text-align:left;color:var(--mute);font-weight:600;padding:10px 8px;border-bottom:1px solid var(--line)}
td{padding:12px 8px;border-bottom:1px solid #EEF1F6}
.chip{font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px;background:#E3F5EA;color:#0F6B3E}
.chip.o{background:#FFE8D1;color:#9A3412}
dl{display:grid;grid-template-columns:minmax(120px,200px) 1fr;gap:10px 16px;margin:0;font-size:14px}
dt{color:var(--mute)}dd{margin:0;font-weight:600}
.btn{min-height:44px;padding:0 18px;border:1px solid var(--blue);border-radius:10px;background:#fff;color:var(--blue);font-weight:600;font-size:14px;font-family:inherit;text-decoration:none;display:inline-flex;align-items:center}
.fld label{display:block;font-size:13px;color:var(--mute);margin-bottom:6px}
.fld input,.fld select{width:100%;min-height:44px;padding:0 12px;border:1px solid #CBD3E1;border-radius:10px;background:#fff;font-family:inherit;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.btn.pri{background:var(--blue);color:#fff}
.avatar{width:110px;height:110px;border-radius:50%;background:#E3E7F5;color:var(--blue);font-size:44px;font-weight:700;display:flex;align-items:center;justify-content:center;overflow:hidden;margin:0 auto}
.avatar img{width:100%;height:100%;object-fit:cover}
.ok{color:#0F6B3E}
.cardpv{display:flex;gap:16px;flex-wrap:wrap;margin:14px 0}.cardpv canvas{width:216px;max-width:46%;height:auto;border-radius:14px;box-shadow:0 4px 16px rgba(15,31,77,.2)}
textarea{width:100%;min-height:90px;padding:10px 12px;border:1px solid #CBD3E1;border-radius:10px;font-family:inherit;font-size:14px}
button,select,summary,label[for],a,.btn,input[type=file]{cursor:pointer}
button:disabled{cursor:not-allowed}
nav a,.btn,button,.card,tbody tr,.fld input,.fld select{transition:background-color .18s ease,color .18s ease,box-shadow .2s ease,transform .15s ease,border-color .18s ease}
nav a:not(.on):not(.soon):hover{background:rgba(255,255,255,.1);color:#fff;transform:translateX(3px)}
nav a.on{box-shadow:0 2px 10px rgba(241,90,41,.35)}
.me button:hover{background:rgba(255,255,255,.14)}
.btn:hover{box-shadow:0 2px 10px rgba(40,56,145,.2);transform:translateY(-1px)}
.btn:active,.eye:active,.me button:active{transform:translateY(0) scale(.97)}
.btn.pri:hover{background:#1f2d78}
.card:hover{box-shadow:0 4px 18px rgba(15,31,77,.08)}
tbody tr:hover{background:#F7F9FD}
.fld input:focus,.fld select:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(40,56,145,.15)}
.eye svg{transition:transform .15s ease}.eye:hover svg{transform:scale(1.15)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tab{min-height:44px;padding:0 20px;border:1px solid #CBD3E1;border-radius:10px;background:#fff;color:var(--ink);font:600 14px 'Noto Sans Bengali','Inter',sans-serif;transition:background-color .18s ease,color .18s ease}
.tab:hover{background:#EEF1F6}.tab.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.st{display:inline-block;font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px;white-space:nowrap;background:#EEF1F6;color:#4B5563}
.st-p{background:#E3F5EA;color:#0F6B3E}.st-in{background:#DDE6FF;color:#1B2E9A}.st-a{background:#FDE2E2;color:#9B1C1C}.st-h{background:#EEF1F6;color:#4B5563}.st-l{background:#EFE3FA;color:#6B2FA0}.st-w{background:#EEF1F6;color:#5B6577}.st-x{background:#FFF3C4;color:#7A5B00}
.sumrow{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px}.sumrow div{flex:1 1 110px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 16px;color:var(--mute);font-size:13px}.sumrow b{display:block;font-size:26px;color:var(--ink)}
.mx th,.mx td{padding:3px;text-align:center;font-size:12px}
.cell{display:inline-block;width:28px;height:28px;line-height:28px;border-radius:7px;font:600 12px 'Noto Sans Bengali',sans-serif;border:0;padding:0;text-align:center;font-style:normal}
button.cell{cursor:pointer}button.cell:hover{transform:scale(1.12)}
.cell.mis{box-shadow:0 0 0 2px var(--orange)}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:13px;color:var(--mute)}.legend span{display:flex;align-items:center;gap:6px}
.scanbox{position:relative;max-width:460px;margin:0 auto;border-radius:14px;overflow:hidden;background:#0b1020;min-height:240px}
.scanbox video{width:100%;display:block;max-height:60vh;object-fit:cover}
.scanbox .scoff{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#C9D3F0;font-size:16px;background:#0b1020}
.cardpv canvas{cursor:zoom-in}
.scanbox .frame{position:absolute;inset:16% 18%;border:3px solid rgba(255,255,255,.9);border-radius:16px;box-shadow:0 0 0 999px rgba(0,0,0,.35);pointer-events:none}
.bigbtn{flex:1;min-height:68px;border:0;border-radius:14px;font:700 22px 'Noto Sans Bengali','Inter',sans-serif;transition:transform .15s ease,box-shadow .2s ease}
.bigbtn:hover{box-shadow:0 4px 16px rgba(0,0,0,.2);transform:translateY(-1px)}.bigbtn:active{transform:scale(.97)}
.bigbtn.in{background:#0F8A4B;color:#fff}.bigbtn.out{background:var(--orange);color:var(--ink)}
.okcard{border-color:#0F8A4B;background:#F0FAF4;color:#0F6B3E}
.modalbg{position:fixed;inset:0;background:rgba(15,31,77,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal{background:#fff;border-radius:14px;padding:20px;max-width:440px;width:100%;max-height:92vh;overflow:auto}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
#view.enter{animation:fadeUp .3s ease}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.eye{min-width:44px;min-height:44px;border:0;background:transparent;color:var(--blue);border-radius:10px;cursor:pointer;vertical-align:middle;padding:0}.eye:hover{background:#EEF1F6}
.muted{color:var(--mute);font-size:13px}.err{color:#9B1C1C}
@media(max-width:700px){main{padding:18px 14px}nav{max-width:none}}
</style></head><body>
<div id="login">
  <div class="box">
    <img class="logo" src="logo.png" alt="" onerror="this.style.display='none'">
    <h1>Royal Sales HR</h1>
    <p>আপনার Google অ্যাকাউন্ট দিয়ে প্রবেশ করুন</p>
    <div id="gbtn"></div>
    <div id="lerr" role="alert"></div>
  </div>
</div>
<div id="app" class="hide">
  <nav aria-label="প্রধান মেনু">
    <div class="brand"><div class="lg"><img src="logo.png" alt="" onerror="this.style.display='none'"></div><div><b>Royal Sales</b><small>HR ও বেতন ব্যবস্থাপনা</small></div></div>
    <a class="soon" href="#">ড্যাশবোর্ড</a><a id="navAtt" href="#/attendance">হাজিরা</a>
    <a id="navEmp" href="#/employees">কর্মচারী</a>
    <a class="soon" href="#">ছুটি</a><a class="soon" href="#">বেতন</a><a class="soon" href="#">ঈদ বোনাস</a>
    <a class="soon" href="#">অগ্রিম ও ধার</a><a class="soon" href="#">নগদ হিসাব</a>
    <a id="navUsers" class="hide" href="#/users">ব্যবহারকারী</a>
    <a id="navDes" class="hide" href="#/designations">পদবী</a>
    <a id="navCards" class="hide" href="#/cards">আইডি কার্ড</a>
    <a id="navCo" class="hide" href="#/company">কোম্পানির তথ্য</a>
    <div class="me"><div id="meName"></div><div id="meRole"></div><button id="logout">লগআউট</button></div>
  </nav>
  <main id="view" aria-live="polite"></main>
</div>
<script>
// === Fill these two values (same as the test page) ===
const CLIENT_ID = '55018750857-l06mb2en1nflf3e56scfcm8psus7f8a5.apps.googleusercontent.com';
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzCtprsLK_LzquwhsNNSnQoyOCHm41Sb5WNZ7scl58fGWxl3sMQ1MJe4Vuw9waEe5rq/exec';
// =====================================================
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const bn = n => (n === null || n === undefined || n === '') ? '—' : '৳ ' + Number(n).toLocaleString('bn-BD');
const ROLE = {'Super Admin':'সুপার অ্যাডমিন','Owner':'মালিক','Admin':'অ্যাডমিন','Staff':'কর্মচারী'};
let ME = null;

// The server gives a 24-hour session after the Google login; it is kept in this browser.
function getToken(){ try{ const t=localStorage.getItem('rs_session'), x=Number(localStorage.getItem('rs_exp')); return t&&x>Date.now()?t:null; }catch(e){ return null; } }
function setToken(t){ try{ if(t){ localStorage.setItem('rs_session',t); localStorage.setItem('rs_exp',String(Date.now()+23.5*3600*1000)); } else { localStorage.removeItem('rs_session'); localStorage.removeItem('rs_exp'); } }catch(e){} }

async function api(action, params){
  const token = getToken();
  if(!token) throw new Error('NOT_LOGGED_IN');
  const r = await fetch(SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({session:token,action,params:params||{}})});
  const j = await r.json();
  if(!j.ok) throw new Error(j.error);
  return j.data;
}

function showLogin(msg){
  $('app').classList.add('hide'); $('login').classList.remove('hide');
  $('lerr').textContent = msg||'';
}
function logout(){
  setToken(null); ME=null;
  if(window.google&&google.accounts) google.accounts.id.disableAutoSelect();
  showLogin('');
}
$('logout').onclick = logout;

async function start(){
  try{
    ME = await api('me');
    $('meName').textContent = ME.name || ME.email;
    $('meRole').textContent = ROLE[ME.role] || ME.role;
    $('navUsers').classList.toggle('hide', !ME.can.sa);
    $('navDes').classList.toggle('hide', !ME.can.sa);
    $('navCards').classList.toggle('hide', !ME.can.sa);
    $('navCo').classList.toggle('hide', !ME.can.sa);
    $('login').classList.add('hide'); $('app').classList.remove('hide');
    route();
  }catch(e){
    setToken(null);
    if(String(e.message).startsWith('NOT_ALLOWED')) showLogin('এই ইমেইল (' + e.message.split(':')[1] + ') দিয়ে প্রবেশের অনুমতি নেই। মালিকপক্ষের সঙ্গে যোগাযোগ করুন।');
    else showLogin(e.message==='NOT_LOGGED_IN'?'':'সমস্যা হয়েছে: '+e.message);
  }
}

async function onCred(resp){
  try{
    const r = await fetch(SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'login',idToken:resp.credential})});
    const j = await r.json();
    if(!j.ok) throw new Error(j.error);
    setToken(j.data.session); start();
  }catch(e){
    if(String(e.message).startsWith('NOT_ALLOWED')) showLogin('এই ইমেইল ('+e.message.split(':')[1]+') দিয়ে প্রবেশের অনুমতি নেই। মালিকপক্ষের সঙ্গে যোগাযোগ করুন।');
    else showLogin('সমস্যা হয়েছে: '+e.message);
  }
}
window.addEventListener('load',()=>{
  const t=setInterval(()=>{ if(window.google&&google.accounts){ clearInterval(t);
    google.accounts.id.initialize({client_id:CLIENT_ID,callback:onCred,auto_select:true});
    google.accounts.id.renderButton($('gbtn'),{theme:'outline',size:'large',text:'signin_with'});
    if(getToken()) start(); else google.accounts.id.prompt();
  }},150);
});

/* ---------- pages ---------- */
window.addEventListener('hashchange',()=>{ if(ME) route(); });
const EYE='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>';
const EYEOFF='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.9 17.9A10.9 10.9 0 0 1 12 19C5 19 1 12 1 12a18.5 18.5 0 0 1 5.1-5.9M9.9 4.2A10.7 10.7 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.2 3.2M1 1l22 22"/></svg>';
const MASK='৳ ••••••';
let hideTimer=null;
function autoHide(fn){ clearTimeout(hideTimer); hideTimer=setTimeout(fn,60000); }
function route(){
  clearTimeout(hideTimer); stopCam();
  const h = location.hash || '#/employees';
  document.querySelectorAll('nav a').forEach(a=>a.classList.remove('on'));
  const m = h.match(/^#\/employee\/(.+)$/);
  const vw=$('view'); vw.classList.remove('enter'); void vw.offsetWidth; vw.classList.add('enter');
  if(h==='#/attendance'){ $('navAtt').classList.add('on'); attendancePage(); return; }
  if(h==='#/cards'){ $('navCards').classList.add('on'); cardsPage(); return; }
  if(h==='#/company'){ $('navCo').classList.add('on'); companyPage(); return; }
  if(h==='#/designations'){ $('navDes').classList.add('on'); designationsPage(); return; }
  if(h==='#/new'){ $('navEmp').classList.add('on'); newEmployee(); return; }
  if(h==='#/users'){ $('navUsers').classList.add('on'); usersPage(); return; }
  $('navEmp').classList.add('on');
  if(m) profile(decodeURIComponent(m[1])); else employees();
}
const FRI = g => (g==='TRN'||g==='CCTV') ? 'ছুটি (বিকাল ৩:৩০ থেকে)' : 'কাজ করেন';
const BON = e => e==='Fixed' ? 'Fixed ৫০%' : e==='Discretionary' ? 'ইচ্ছামতো' : e==='None' ? 'নেই' : '—';
const eyeBtn=(id,on,label)=>'<button class="eye" data-eye="'+esc(id)+'" aria-pressed="'+(on?'true':'false')+'" aria-label="'+label+'" title="'+label+'">'+(on?EYEOFF:EYE)+'</button>';

let META=null;
async function meta(){ if(!META) META=await api('meta.get'); return META; }
const LBL={name_bn:'নাম (বাংলা)',name_en:'নাম (ইংরেজি)',mobile:'মোবাইল',address:'বর্তমান ঠিকানা',birth_date:'জন্ম তারিখ',permanent_address:'স্থায়ী ঠিকানা',emergency_contact:'জরুরি যোগাযোগ',nid_number:'NID নম্বর',joining_date:'যোগদানের তারিখ',employment_type:'চাকরির ধরন',shift_group_id:'শিফট গ্রুপ',eid_bonus_mode:'ঈদ বোনাসের ধরন'};
const FIELD_ORDER=['name_bn','name_en','mobile','emergency_contact','birth_date','nid_number','address','permanent_address','joining_date','employment_type','shift_group_id','eid_bonus_mode'];
const inOrder=keys=>FIELD_ORDER.filter(k=>keys.includes(k)).concat(keys.filter(k=>!FIELD_ORDER.includes(k)));
const BONL={Fixed:'Fixed ৫০%',Discretionary:'ইচ্ছামতো',None:'নেই'};
const STL={Active:'সক্রিয়',Inactive:'নিষ্ক্রিয়',Resigned:'চাকরি ছেড়েছেন','Terminated':'বরখাস্ত','On Leave':'ছুটিতে'};
const sel=(id,opts,cur,blank)=>'<select id="'+id+'">'+(blank?'<option value="">— বাছাই করুন —</option>':'')+opts.map(o=>'<option value="'+esc(o.v)+'"'+(String(o.v)===String(cur)?' selected':'')+'>'+esc(o.t)+'</option>').join('')+'</select>';
function fld(k,val,m){
  const id='f_'+k; let c;
  if(k==='joining_date'||k==='birth_date') c='<input id="'+id+'" type="date" value="'+esc(val)+'">';
  else if(k==='employment_type') c=sel(id,m.emp_types.map(x=>({v:x,t:x})),val,true);
  else if(k==='shift_group_id') c=sel(id,m.shifts.map(x=>({v:x.id,t:x.name})),val,false);
  else if(k==='eid_bonus_mode') c=sel(id,m.eid_modes.map(x=>({v:x,t:BONL[x]})),val,false);
  else if(k==='mobile'||k==='emergency_contact') c='<input id="'+id+'" type="tel" inputmode="numeric" value="'+esc(val)+'">';
  else if(k==='nid_number') c='<input id="'+id+'" type="text" inputmode="numeric" value="'+esc(val)+'">';
  else c='<input id="'+id+'" type="text" value="'+esc(val)+'">';
  return '<div class="fld"><label for="'+id+'">'+LBL[k]+'</label>'+c+'</div>';
}
const readF=keys=>{ const o={}; keys.forEach(k=>o[k]=$('f_'+k).value); return o; };
const say=(t,ok)=>{ const m=$('msg'); if(m){ m.textContent=t; m.className=ok?'ok':'err'; } };

// Makes a clickable link from a value with no spaces that looks like a web address, email or phone number.
// Only http(s), mailto and tel links are ever created, never anything else.
function linkOf(s){
  s=String(s||'').trim(); if(!s||/\s/.test(s)) return null;
  if(/^https?:\/\/\S+$/i.test(s)) return s;
  if(/^[^\s@:\/]+@[^\s@:\/]+\.[^\s@:\/]+$/.test(s)) return 'mailto:'+s;
  if(/^\+?[\d০-৯][\d০-৯-]{7,}$/.test(s)) return 'tel:'+s.replace(/[^\d+]/g,'');
  if(/^(www\.)?[a-z0-9-]+(\.[a-z0-9-]+)+(\/\S*)?$/i.test(s)) return 'https://'+s;
  return null;

function resize(file,max){ return new Promise((res,rej)=>{ const img=new Image(), url=URL.createObjectURL(file);
  img.onload=()=>{ const s=Math.min(1,max/Math.max(img.width,img.height)), c=document.createElement('canvas');
    c.width=Math.round(img.width*s); c.height=Math.round(img.height*s); c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg',0.82)); };
  img.onerror=()=>rej(new Error('ছবি পড়া যায়নি')); img.src=url; }); }

      on('cToggle',async()=>{ cardOpen=!cardOpen; draw();
        if(cardOpen&&r.card_issued_at&&!cardRes&&(id===ME.employee_id||ME.can.sa)){ try{ cardRes=await api('cards.get',{ids:[id]}); showCard(); }catch(e){ const b=$('cardPv'); if(b) b.textContent=errText(e); } } });
      on('cIssue',()=>{ if(r.card_issued_at){ cardPanel=true; draw(); } else issueCard(false); });
      on('cNo',()=>{ cardPanel=false; draw(); });
      on('cGo',()=>issueCard($('cNew').checked));
      const pi=$('phIn'); if(pi) pi.onchange=async()=>{ try{ say('ছবি পাঠানো হচ্ছে...',true); const d=await resize(pi.files[0],480); await api('photo.set',{id,dataUrl:d}); profile(id); }catch(e){ if(isAuthErr(e)) fail(e); else say(errText(e)); } };
    };
    const showCard=async()=>{
      const box=$('cardPv'); if(!box||!cardRes) return;
      try{ cardCanv=await IDCARD.renderCard(cardRes.cards[0],cardRes.company,cardLang,'logo.png'); box.innerHTML=''; box.append(cardCanv.front,cardCanv.back); [cardCanv.front,cardCanv.back].forEach(c=>{ c.title='বড় করে দেখুন'; c.onclick=()=>zoomCard(cardCanv); }); }catch(e){ box.textContent='কার্ড আঁকা যায়নি: '+e.message; }
    };
    const issueCard=async nq=>{
      try{ const res=await api('cards.issue',{ids:[id],new_qr:nq}); const x=res[0];
        if(!x.ok){ say(x.error); return; }
        say('কার্ড তৈরি হয়েছে।'+(x.warnings.length?' সতর্কতা: '+x.warnings.join(', ')+'।':''),true);
        CARD_OPEN_NEXT=true; setTimeout(()=>profile(id),900); }catch(e){ if(isAuthErr(e)) fail(e); else say(errText(e)); }
    };
    const act=async(a,p)=>{ try{ await api(a,p); say('সংরক্ষণ হয়েছে।',true); setTimeout(()=>profile(id),600); }catch(e){ if(isAuthErr(e)) fail(e); else say(errText(e)); } };
    draw();
    if(cardOpen && r.card_issued_at && (id===ME.employee_id || ME.can.sa)){ try{ cardRes=await api('cards.get',{ids:[id]}); showCard(); }catch(e){ const b=$('cardPv'); if(b) b.textContent=errText(e); } }
  }catch(e){ fail(e); }
}
const isAuthErr=e=>e.message==='NOT_LOGGED_IN'||String(e.message).startsWith('NOT_ALLOWED');
const errText=e=>e.message==='NOT_PERMITTED'?'এই কাজের অনুমতি আপনার নেই।':e.message;

const bnd = s => String(s).replace(/\d/g, d => '০১২৩৪৫৬৭৮৯'[d]);
const MONTHS = ['জানুয়ারি','ফেব্রুয়ারি','মার্চ','এপ্রিল','মে','জুন','জুলাই','আগস্ট','সেপ্টেম্বর','অক্টোবর','নভেম্বর','ডিসেম্বর'];
const WDAYS = ['রবিবার','সোমবার','মঙ্গলবার','বুধবার','বৃহস্পতিবার','শুক্রবার','শনিবার'];
function fmtT(t){ if(!t) return '—'; const a=t.split(':').map(Number), h=a[0], m=a[1]; const p=h<4?'রাত':h<12?'সকাল':h<16?'দুপুর':h<18?'বিকাল':h<20?'সন্ধ্যা':'রাত'; return p+' '+bnd((h%12||12)+':'+('0'+m).slice(-2)); }
function fmtD(d){ const x=new Date(Date.UTC(+d.slice(0,4),+d.slice(5,7)-1,+d.slice(8,10))); return bnd(+d.slice(8,10))+' '+MONTHS[+d.slice(5,7)-1]+' '+bnd(d.slice(0,4))+' ('+WDAYS[x.getUTCDay()]+')'; }
function fmtH(h){ const m=Math.round(h*60); if(!m) return '—'; const hh=Math.floor(m/60), mm=m%60; return (hh?bnd(hh)+' ঘণ্টা ':'')+(mm?bnd(mm)+' মিনিট':'').trim(); }
function addDays(d,n){ const x=new Date(Date.UTC(+d.slice(0,4),+d.slice(5,7)-1,+d.slice(8,10))+n*86400000); return x.toISOString().slice(0,10); }
const ST = {p:'উপস্থিত',in:'কাজে আছেন',a:'অনুপস্থিত',h:'ছুটির দিন',l:'ছুটি',w:'এখনও আসেননি',x:'শুধু Exit আছে',f:'',na:''};
const CELL = {p:'প',in:'•',a:'অ',h:'ব',l:'ছু',w:'·',x:'?',f:'',na:'—'};
const TYPE_L = {IN:'Entry',OUT:'Exit'};
const stChip = s => '<span class="st st-'+s+'">'+esc(ST[s]||'')+'</span>';

function modal(html,wide){
  const bg=document.createElement('div'); bg.className='modalbg';
  bg.innerHTML='<div class="modal" role="dialog" aria-modal="true"'+(wide?' style="max-width:min(980px,96vw)"':'')+'>'+html+'</div>';
  const close=()=>{ bg.remove(); document.removeEventListener('keydown',esc_); };
  const esc_=e=>{ if(e.key==='Escape') close(); };
  document.addEventListener('keydown',esc_);
  bg.addEventListener('mousedown',e=>{ if(e.target===bg) close(); });
  document.body.appendChild(bg); bg.close=close; return bg;
}
const todayStr = () => new Date(Date.now()+6*3600*1000).toISOString().slice(0,10);   // Bangladesh date (UTC+6)
const nowHM = () => new Date(Date.now()+6*3600*1000).toISOString().slice(11,16);

let ATT={tab:'',date:'',month:'',emp:'',people:null,names:null};
const SC={on:false,stream:null,timer:0,busy:false,lastCode:'',until:0,video:null,cv:null,gen:0};

function stopCam(){
  SC.on=false; SC.gen++; clearTimeout(SC.timer);
  if(SC.stream){ SC.stream.getTracks().forEach(t=>t.stop()); SC.stream=null; }
}

async function attendancePage(){
  const v=$('view'), A=ME.can.att;
  const tabs=[]; if(A.scan) tabs.push(['scan','স্ক্যান']);
  tabs.push(['day',A.scope==='self'?'আমার হাজিরা':'দিনের হাজিরা']);
  if(A.scope!=='today') tabs.push(['month','মাসিক']);
  if(!ATT.tab||!tabs.some(t=>t[0]===ATT.tab)) ATT.tab=tabs[0][0];
  v.innerHTML='<h1 class="t">'+(A.scope==='self'&&!A.scan?'আমার হাজিরা':'হাজিরা')+'</h1><div class="sub">'+(A.scan?'কর্মচারীর কার্ডের QR স্ক্যান করে Entry বা Exit নিন।':'আপনার হাজিরার তথ্য এখানে দেখা যাবে।')+'</div>'+
    '<div id="msg" role="alert" style="margin-bottom:12px"></div><div class="tabs" role="tablist">'+tabs.map(t=>'<button class="tab'+(t[0]===ATT.tab?' on':'')+'" role="tab" data-tab="'+t[0]+'">'+t[1]+'</button>').join('')+'</div><div id="attBody"></div>';
  v.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{ ATT.tab=b.dataset.tab; attendancePage(); });
  stopCam();
  try{
    if(ATT.tab==='scan') await attScan(); else if(ATT.tab==='month') await attMonth(); else await attDay();
  }catch(e){ if(isAuthErr(e)) fail(e); else $('attBody').innerHTML='<p class="err">'+esc(errText(e))+'</p>'; }
}

/* ---------- day list ---------- */
async function attDay(){
  const A=ME.can.att, b=$('attBody');
  b.innerHTML='<p class="muted">লোড হচ্ছে...</p>';
  const d=await api('att.day',{date:ATT.date||''}); ATT.date=d.date;
  const cnt={p:0,a:0,l:0,h:0,m:0};
  d.rows.forEach(r=>{ if(r.s==='p'||r.s==='in') cnt.p++; else if(r.s==='a') cnt.a++; else if(r.s==='l') cnt.l++; else if(r.s==='h') cnt.h++; if(r.missing_exit) cnt.m++; });
  const dateCtl = d.scope==='today' ? '<b>'+fmtD(d.date)+'</b>' :
    '<button class="btn" id="dPrev" aria-label="আগের দিন">‹</button> <input type="date" id="dDate" value="'+d.date+'" max="'+d.today+'" style="min-height:44px;padding:0 10px;border:1px solid #CBD3E1;border-radius:10px;font-family:inherit"> <button class="btn" id="dNext" aria-label="পরের দিন"'+(d.date>=d.today?' disabled':'')+'>›</button> <button class="btn" id="dToday">আজ</button>';
  b.innerHTML='<div class="card"><div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between"><div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">'+dateCtl+'</div>'+
    (A.manual?'<button class="btn pri" id="dManual">হাতে Entry/Exit যোগ করুন</button>':'')+'</div>'+
    '<div class="muted" style="margin-top:8px">'+fmtD(d.date)+'</div></div>'+
    (d.scope==='self'?'':'<div class="sumrow"><div><b>'+bnd(cnt.p)+'</b>উপস্থিত</div><div><b>'+bnd(cnt.a)+'</b>অনুপস্থিত</div><div><b>'+bnd(cnt.l)+'</b>ছুটি</div><div><b>'+bnd(cnt.h)+'</b>ছুটির দিন</div><div><b>'+bnd(cnt.m)+'</b>Exit নেই</div></div>')+
    '<div class="card"><div class="tw"><table><thead><tr><th>কর্মচারী</th><th>অবস্থা</th><th>প্রথম Entry</th><th>শেষ Exit</th><th>মোট সময়</th><th></th></tr></thead><tbody>'+
    (d.rows.length?d.rows.map((r,i)=>'<tr><td style="font-weight:600">'+esc(r.name_bn)+'<div class="muted" style="font-weight:400">'+esc(r.designation)+'</div></td><td>'+stChip(r.s)+(r.missing_exit?' <span class="st st-x">Exit নেই</span>':'')+(r.note?' <span class="muted">'+esc(r.note)+'</span>':'')+'</td><td>'+fmtT(r.first_in)+'</td><td>'+fmtT(r.last_out)+'</td><td>'+fmtH(r.hours)+'</td><td><button class="btn" data-ex="'+i+'" aria-expanded="false">বিস্তারিত</button></td></tr><tr class="hide" id="ex'+i+'"><td colspan="6" style="background:#F7F9FD">'+evList(r,d)+'</td></tr>').join(''):'<tr><td colspan="6" class="muted">এই দিনের কোনো কর্মচারী নেই।</td></tr>')+
    '</tbody></table></div></div>';
  const go=dt=>{ ATT.date=dt; attDay().catch(e=>{ if(isAuthErr(e)) fail(e); else say(errText(e)); }); };
  if($('dDate')){ $('dDate').onchange=()=>{ if($('dDate').value) go($('dDate').value); }; $('dPrev').onclick=()=>go(addDays(d.date,-1)); $('dNext').onclick=()=>go(addDays(d.date,1)); $('dToday').onclick=()=>go(d.today); }
  if($('dManual')) $('dManual').onclick=()=>manualModal({date:d.date},()=>attDay());
  b.querySelectorAll('[data-ex]').forEach(x=>x.onclick=()=>{ const row=$('ex'+x.dataset.ex); const open=row.classList.toggle('hide'); x.setAttribute('aria-expanded',String(!open)); });
  b.querySelectorAll('[data-add]').forEach(x=>x.onclick=()=>manualModal({date:d.date,employee_id:x.dataset.add},()=>attDay()));
  b.querySelectorAll('[data-edit]').forEach(x=>x.onclick=()=>{ const [i,j]=x.dataset.edit.split('.').map(Number); editModal(d.rows[i].ev[j],d.date,()=>attDay()); });

function evList(r,d){
  const A=ME.can.att;
  const list=r.ev.length?'<table style="min-width:0"><thead><tr><th>সময়</th><th>ধরন</th><th>কীভাবে</th><th>কে নিলেন</th><th>কারণ</th><th></th></tr></thead><tbody>'+
    r.ev.map((e,j)=>'<tr><td>'+fmtT(e.time)+'</td><td><span class="st '+(e.type==='IN'?'st-p':'st-h')+'">'+TYPE_L[e.type]+'</span></td><td>'+(e.method==='QR'?'QR স্ক্যান':'হাতে')+(e.edited?' (সংশোধিত)':'')+'</td><td>'+esc(e.by)+'</td><td>'+esc(e.reason)+'</td><td>'+(A.manual?'<button class="btn" data-edit="'+d.rows.indexOf(r)+'.'+j+'">সংশোধন / বাতিল</button>':'')+'</td></tr>').join('')+'</tbody></table>'
    :'<span class="muted">এই দিনে কোনো Entry/Exit নেই।</span>';
  return list+(A.manual?'<div style="margin-top:10px"><button class="btn" data-add="'+esc(r.employee_id)+'">+ এই কর্মচারীর হাতে যোগ করুন</button></div>':'');
}

/* ---------- manual add / edit / void ---------- */
async function manualModal(pref,done){
  try{ if(!ATT.people) ATT.people=await api('att.people'); }catch(e){ say(errText(e)); return; }
  const today=todayStr(), date=pref.date||today;
  const m=modal('<h2 style="margin:0 0 12px;font-size:18px">হাতে Entry/Exit যোগ করুন</h2><div id="mMsg" role="alert" style="margin-bottom:8px"></div><div class="grid" style="grid-template-columns:1fr">'+
    '<div class="fld"><label for="m_emp">কর্মচারী</label>'+sel('m_emp',ATT.people.map(p=>({v:p.id,t:p.name})),pref.employee_id||'',true)+'</div>'+
    '<div class="fld"><label for="m_date">তারিখ</label><input id="m_date" type="date" value="'+date+'" max="'+today+'"></div>'+
    '<div class="fld"><label for="m_time">সময়</label><input id="m_time" type="time" value="'+(pref.time||(date===today?nowHM():''))+'"></div>'+
    '<div class="fld"><label for="m_type">ধরন</label>'+sel('m_type',[{v:'IN',t:'Entry (আসা)'},{v:'OUT',t:'Exit (যাওয়া)'}],pref.type||'OUT',false)+'</div>'+
    '<div class="fld"><label for="m_why">কারণ (বাধ্যতামূলক)</label><input id="m_why" type="text" maxlength="200" placeholder="যেমন: লাঞ্চে যাওয়ার সময় Exit দিতে ভুলে গেছেন"></div></div>'+
    '<div style="margin-top:14px;display:flex;gap:10px"><button class="btn pri" id="m_ok">সংরক্ষণ করুন</button><button class="btn" id="m_no">বাতিল</button></div>');
  $('m_no').onclick=()=>m.close();
  $('m_ok').onclick=async()=>{
    const btn=$('m_ok'); btn.disabled=true;
    try{ await api('att.manual',{employee_id:$('m_emp').value,date:$('m_date').value,time:$('m_time').value,type:$('m_type').value,reason:$('m_why').value}); m.close(); if(done) await done(); }
    catch(e){ btn.disabled=false; if(isAuthErr(e)){ m.close(); fail(e); } else { $('mMsg').textContent=errText(e); $('mMsg').className='err'; } }
  };
}
function editModal(ev,date,done){
  const m=modal('<h2 style="margin:0 0 4px;font-size:18px">রেকর্ড সংশোধন</h2><div class="muted" style="margin-bottom:10px">'+fmtD(date)+' · এখন: '+fmtT(ev.time)+' '+TYPE_L[ev.type]+'</div><div id="eMsg" role="alert" style="margin-bottom:8px"></div><div class="grid" style="grid-template-columns:1fr">'+
    '<div class="fld"><label for="e_time">সঠিক সময়</label><input id="e_time" type="time" value="'+ev.time+'"></div>'+
    '<div class="fld"><label for="e_type">ধরন</label>'+sel('e_type',[{v:'IN',t:'Entry (আসা)'},{v:'OUT',t:'Exit (যাওয়া)'}],ev.type,false)+'</div>'+
    '<div class="fld"><label for="e_why">কারণ (সংশোধনে বাধ্যতামূলক, বাতিলে ঐচ্ছিক)</label><input id="e_why" type="text" maxlength="200"></div></div>'+
    '<div style="margin-top:14px;display:flex;gap:10px;flex-wrap:wrap"><button class="btn pri" id="e_ok">সংশোধন সংরক্ষণ</button><button class="btn" id="e_void" style="border-color:#9B1C1C;color:#9B1C1C">রেকর্ডটি বাতিল করুন</button><button class="btn" id="e_no">বন্ধ করুন</button></div>');
  $('e_no').onclick=()=>m.close();
  const run=async(action,p)=>{
    [$('e_ok'),$('e_void')].forEach(x=>x.disabled=true);
    try{ await api(action,p); m.close(); if(done) await done(); }
    catch(e){ [$('e_ok'),$('e_void')].forEach(x=>x.disabled=false); if(isAuthErr(e)){ m.close(); fail(e); } else { $('eMsg').textContent=errText(e); $('eMsg').className='err'; } }
  };
  $('e_ok').onclick=()=>run('att.edit',{event_id:ev.id,time:$('e_time').value,type:$('e_type').value,reason:$('e_why').value});
  $('e_void').onclick=()=>{ if(confirm('এই রেকর্ড বাতিল করবেন? (মুছে যাবে না, বাতিল চিহ্ন থাকবে ও লগে লেখা থাকবে)')) run('att.void',{event_id:ev.id,reason:$('e_why').value}); };
}

  b.innerHTML='<p class="muted">লোড হচ্ছে...</p>';
  if(!ATT.month) ATT.month=todayStr().slice(0,7);
  const d=await api('att.month',{month:ATT.month,employee_id:ATT.emp||''});
  if(A.scope==='all' && !ATT.emp) ATT.names=d.rows.map(r=>({id:r.employee_id,name:r.name_bn}));
  const days=[]; for(let i=1;i<=d.days;i++) days.push(i);
  const wd=i=>{ const x=new Date(Date.UTC(+d.month.slice(0,4),+d.month.slice(5,7)-1,i)); return x.getUTCDay(); };
  b.innerHTML='<div class="card"><div style="display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end"><div class="fld"><label for="mm">মাস</label><input id="mm" type="month" value="'+d.month+'" max="'+d.today.slice(0,7)+'"></div>'+

    '<div class="muted" style="margin-top:10px">'+MONTHS[+d.month.slice(5,7)-1]+' '+bnd(d.month.slice(0,4))+'</div>'+
    '<div class="legend"><span><i class="cell st-p">প</i> উপস্থিত</span><span><i class="cell st-in">•</i> কাজে আছেন</span><span><i class="cell st-a">অ</i> অনুপস্থিত</span><span><i class="cell st-h">ব</i> ছুটির দিন</span><span><i class="cell st-l">ছু</i> ছুটি</span><span><i class="cell st-x">?</i> শুধু Exit</span><span><i class="cell st-p mis">প</i> Exit নেই</span></div></div>'+
    '<div class="card"><div class="tw"><table class="mx" style="min-width:0"><thead><tr><th style="text-align:left;min-width:130px">কর্মচারী</th>'+days.map(i=>'<th'+(wd(i)===5?' style="color:var(--orange)"':'')+'>'+bnd(i)+'</th>').join('')+'</tr></thead><tbody>'+
    (d.rows.length?d.rows.map((r,ri)=>'<tr><td style="text-align:left;font-weight:600;white-space:nowrap">'+esc(r.name_bn)+'</td>'+r.cells.map(c=>'<td>'+(c.s&&c.s!=='f'?'<button class="cell st-'+c.s+(c.m?' mis':'')+'" data-d="'+c.d+'" title="'+esc(ST[c.s]+(c.h?' · '+fmtH(c.h):'')+(c.m?' · Exit নেই':''))+'">'+CELL[c.s]+'</button>':'')+'</td>').join('')+'</tr>').join(''):'<tr><td colspan="'+(d.days+1)+'" class="muted" style="text-align:left">এই মাসে কোনো কর্মচারী নেই।</td></tr>')+
    '</tbody></table></div></div>'+
    '<div class="card"><h2>মাসের সারাংশ</h2><div class="tw"><table><thead><tr><th>কর্মচারী</th><th>উপস্থিত</th><th>অনুপস্থিত</th><th>ছুটির দিন</th><th>ছুটি</th><th>Exit নেই</th><th>মোট সময়</th></tr></thead><tbody>'+
    d.rows.map(r=>'<tr><td style="font-weight:600">'+esc(r.name_bn)+'</td><td>'+bnd(r.sum.p)+'</td><td>'+bnd(r.sum.a)+'</td><td>'+bnd(r.sum.h)+'</td><td>'+bnd(r.sum.l)+'</td><td>'+bnd(r.sum.missing)+'</td><td>'+fmtH(r.sum.hours)+'</td></tr>').join('')+'</tbody></table></div><div class="muted" style="margin-top:10px">"অনুপস্থিত" শুধু তথ্য। বেতন কাটা হবে কি না তা মালিকদের সিদ্ধান্তে বেতন তৈরির সময় ঠিক হবে। যোগদানের আগের দিন গোনা হয় না।</div></div>';

/* ---------- QR scan ---------- */
const camPref=()=>{ try{ return localStorage.getItem('rs_cam')==='user'?'user':'environment'; }catch(e){ return 'environment'; } };
const camSet=v=>{ try{ localStorage.setItem('rs_cam',v); }catch(e){} };
const camName=()=>camPref()==='user'?'সামনের ক্যামেরা':'পেছনের ক্যামেরা';
function pauseCam(){
  stopCam();
  const v=$('scV'); if(v) v.srcObject=null;
  const o=$('scOff'), f=$('scFrame'); if(o) o.classList.remove('hide'); if(f) f.classList.add('hide');
}
async function attScan(){
  const b=$('attBody');
  b.innerHTML='<div class="card"><div class="scanbox"><video id="scV" playsinline muted></video><div class="frame" id="scFrame"></div><div id="scOff" class="scoff hide">ক্যামেরা বন্ধ আছে</div></div><div id="scSt" class="muted" style="text-align:center;margin-top:10px" role="status">ক্যামেরা চালু হচ্ছে...</div><div style="text-align:center;margin-top:10px"><button class="btn" id="scSwitch">সামনের / পেছনের ক্যামেরা বদলান</button></div></div><div id="scRes"></div>';
  if(typeof jsQR==='undefined'){ $('scSt').textContent='QR পড়ার অংশ লোড হয়নি। ইন্টারনেট দেখে পেজ রিফ্রেশ করুন।'; $('scSt').className='err'; return; }
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){ $('scSt').textContent='এই ব্রাউজারে ক্যামেরা চলে না। Chrome বা Safari-তে খুলুন।'; $('scSt').className='err'; return; }
  $('scSwitch').onclick=()=>{ camSet(camPref()==='user'?'environment':'user'); camStart(); };
  await camStart();
}
async function camStart(){
  stopCam();
  const g=++SC.gen, st=$('scSt'); if(!st) return;
  st.className='muted'; st.textContent=camName()+' চালু হচ্ছে...';
  let stream;
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:camPref()},width:{ideal:1280},height:{ideal:720}},audio:false});
  }catch(e){
    if(g!==SC.gen||!$('scSt')) return;
    st.className='err';
    st.textContent=(e&&e.name==='NotAllowedError')?'ক্যামেরার অনুমতি দেওয়া হয়নি। ব্রাউজারের ঠিকানার পাশের তালা চিহ্নে চেপে ক্যামেরা "Allow" করুন, তারপর রিফ্রেশ করুন।':(e&&e.name==='NotFoundError')?'কোনো ক্যামেরা পাওয়া যায়নি।':'ক্যামেরা চালু করা যায়নি: '+(e&&e.message||e);
    return;
  }
  if(g!==SC.gen||!$('scV')){ stream.getTracks().forEach(t=>t.stop()); return; }   // page changed while the camera was starting
  SC.stream=stream; SC.video=$('scV'); SC.video.srcObject=stream; await SC.video.play().catch(()=>{});
  if(g!==SC.gen) return;   // page or camera changed meanwhile; stopCam already released the stream
  SC.cv=SC.cv||document.createElement('canvas'); SC.on=true; SC.busy=false;
  const o=$('scOff'), f=$('scFrame'); if(o) o.classList.add('hide'); if(f) f.classList.remove('hide');
  st.textContent=camName()+' · কার্ডের QR ফ্রেমের ভেতরে ধরুন';
  scanLoop();
}
function scanLoop(){
  if(!SC.on) return;
  const vd=SC.video;
  if(!SC.busy && vd && vd.readyState>=2 && vd.videoWidth){
    const w=Math.min(640,vd.videoWidth), h=Math.round(vd.videoHeight*w/vd.videoWidth);
    SC.cv.width=w; SC.cv.height=h;
    const cx=SC.cv.getContext('2d',{willReadFrequently:true}); cx.drawImage(vd,0,0,w,h);
    const img=cx.getImageData(0,0,w,h), c=jsQR(img.data,w,h,{inversionAttempts:'dontInvert'});
    if(c&&c.data&&!(c.data===SC.lastCode&&Date.now()<SC.until)) onScanned(c.data);
  }
  SC.timer=setTimeout(scanLoop,150);
}
// After a result is handled, the camera opens again for the next scan
function scanResume(){ SC.busy=false; const r=$('scRes'); if(r) r.innerHTML=''; if($('scV')) camStart(); }
function scanShow(html){ const r=$('scRes'); if(r) r.innerHTML=html; }
async function onScanned(code){
  SC.busy=true; SC.lastCode=code; SC.until=Date.now()+4000;
  if(navigator.vibrate) navigator.vibrate(60);
  pauseCam();
  try{
    const e=await api('att.lookup',{qr:code});
    const avatar=e.photo?'<img src="'+e.photo+'" alt="">':esc((e.name_bn||'?').trim().charAt(0));
    scanShow('<div class="card" style="text-align:center"><div class="avatar">'+avatar+'</div><h2 style="margin:12px 0 2px;font-size:22px">'+esc(e.name_bn)+'</h2><div class="muted">'+esc(e.designation)+' · '+esc(e.employee_id)+'</div>'+
      '<div style="margin:12px 0">'+(e.today.length?e.today.map(x=>'<span class="st '+(x.type==='IN'?'st-p':'st-h')+'" style="margin:2px">'+TYPE_L[x.type]+' '+fmtT(x.time)+'</span>').join(' '):'<span class="muted">আজ এখনও কোনো Entry/Exit নেই</span>')+'</div>'+
      '<div style="display:flex;gap:12px"><button class="bigbtn in" data-t="IN">Entry</button><button class="bigbtn out" data-t="OUT">Exit</button></div>'+
      '<div style="margin-top:12px"><button class="btn" id="scCancel">বাতিল (পরের জন)</button></div></div>');
    $('scCancel').onclick=scanResume;
    document.querySelectorAll('#scRes [data-t]').forEach(x=>x.onclick=()=>scanRecord(code,e,x.dataset.t,false));
  }catch(er){
    if(isAuthErr(er)){ fail(er); return; }
    scanShow('<div class="card" style="text-align:center"><p class="err" style="font-size:16px;font-weight:600">'+esc(errText(er))+'</p><button class="btn" id="scCancel">ঠিক আছে</button></div>');
    $('scCancel').onclick=scanResume;
  }
}
async function scanRecord(code,e,type,force){
  document.querySelectorAll('#scRes button').forEach(x=>x.disabled=true);
  try{
    const r=await api('att.record',{qr:code,type:type,force:force});
    if(r.needs_confirm){
      const last=r.last?TYPE_L[r.last.type]+' '+fmtT(r.last.time):'';
      const msg=r.why==='in_after_in'?'আজ আগেই '+last+' আছে, কিন্তু মাঝে কোনো Exit নেই।':r.why==='out_after_out'?'আজ আগেই '+last+' আছে।':'আজ এখনও কোনো Entry নেই।';
      const fixType=r.why==='in_after_in'?'OUT':r.why==='out_without_in'?'IN':'';
      scanShow('<div class="card" style="text-align:center"><h2 style="margin:0 0 6px;font-size:18px">'+esc(e.name_bn)+'</h2><p style="font-weight:600;color:#9A3412">'+esc(msg)+'</p><p class="muted">কী করবেন?</p><div style="display:flex;flex-direction:column;gap:10px">'+
        (A_manual()&&fixType?'<button class="btn pri" id="scFix">হাতে '+TYPE_L[fixType]+' যোগ করুন'+(r.why==='in_after_in'?' (তারপর নতুন Entry নেওয়া হবে)':' (তারপর Exit নেওয়া হবে)')+'</button>':'')+
        '<button class="btn" id="scForce">তবুও '+TYPE_L[type]+' দিন</button><button class="btn" id="scCancel">বাতিল</button></div></div>');
      $('scCancel').onclick=scanResume;
      $('scForce').onclick=()=>scanRecord(code,e,type,true);
      if($('scFix')) $('scFix').onclick=()=>manualModal({employee_id:e.employee_id,date:todayStr(),type:fixType},()=>scanRecord(code,e,type,false));
      return;
    }
    scanShow('<div class="card okcard" style="text-align:center"><div style="font-size:44px">✔</div><h2 style="margin:4px 0;font-size:22px">'+esc(r.name_bn)+'</h2><div style="font-size:18px;font-weight:700">'+TYPE_L[r.type]+' · '+fmtT(r.time)+'</div></div>');
    setTimeout(scanResume,2200);
  }catch(er){
    if(isAuthErr(er)){ fail(er); return; }
    scanShow('<div class="card" style="text-align:center"><p class="err" style="font-size:16px;font-weight:600">'+esc(errText(er))+'</p><button class="btn" id="scCancel">ঠিক আছে</button></div>');
    $('scCancel').onclick=scanResume;
  }
}
const A_manual=()=>!!(ME&&ME.can&&ME.can.att&&ME.can.att.manual);

function zoomCard(cc){
  let w=380; const MIN=160, MAX=1100;
  const m=modal('<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px"><b style="flex:1;min-width:120px">আইডি কার্ড (সামনে ও পেছনে)</b><button class="btn" id="zOut" aria-label="ছোট করুন">−</button><button class="btn" id="zIn" aria-label="বড় করুন">+</button><button class="btn" id="zRe">মূল আকার</button><button class="btn" id="zX">বন্ধ</button></div><div id="zBox" style="overflow:auto;max-height:75vh;display:flex;gap:16px;flex-wrap:wrap;justify-content:center;align-items:flex-start;padding:4px"></div><div class="muted" id="zInfo" style="margin-top:8px;text-align:center"></div>',true);
  const cl=[cc.front,cc.back].map(c=>{ const n=document.createElement('canvas'); n.width=c.width; n.height=c.height; n.getContext('2d').drawImage(c,0,0); n.style.cssText='height:auto;max-width:none;border-radius:14px;box-shadow:0 4px 16px rgba(15,31,77,.25)'; return n; });
  $('zBox').append(cl[0],cl[1]);
  const apply=()=>{ cl.forEach(n=>n.style.width=w+'px'); $('zInfo').textContent='আকার: '+bnd(Math.round(w/216*100))+'%'; };
  $('zIn').onclick=()=>{ w=Math.min(MAX,Math.round(w*1.25)); apply(); };
  $('zOut').onclick=()=>{ w=Math.max(MIN,Math.round(w/1.25)); apply(); };
  $('zRe').onclick=()=>{ w=380; apply(); };
  $('zX').onclick=()=>m.close();
  apply();
}
function fail(e){
  if(e.message==='NOT_LOGGED_IN'||String(e.message).startsWith('NOT_ALLOWED')){ logout(); return; }
  $('view').innerHTML='<p class="err">'+(e.message==='NOT_PERMITTED'?'এই তথ্য দেখার অনুমতি আপনার নেই।':'সমস্যা: '+esc(e.message))+'</p>';
}
</script></body></html>
