<!DOCTYPE html>
<html lang="bn"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Royal Sales HR</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--blue:#283891;--navy:#0F1F4D;--orange:#F15A29;--ink:#0F172A;--mute:#5B6577;--line:#E3E7EF;--bg:#F4F6FA}
*{box-sizing:border-box}
body{margin:0;font-family:'Noto Sans Bengali','Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink)}
a{color:var(--blue)}
.hide{display:none!important}
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:28px;max-width:380px;width:100%;text-align:center}
.box h1{margin:12px 0 4px;font-size:22px;color:var(--blue)}
.box p{color:var(--mute);font-size:14px;margin:0 0 20px}
#gbtn{display:flex;justify-content:center;min-height:44px}
#lerr{color:#9B1C1C;font-size:14px;margin-top:14px}
.logo{width:56px;height:56px;object-fit:contain}
#app{display:flex;flex-wrap:wrap;min-height:100vh}
nav{flex:1 1 240px;max-width:270px;background:var(--navy);color:#fff;padding:20px 14px;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:12px;padding:4px 10px 18px}
.brand .lg{width:44px;height:44px;border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.brand .lg img{width:36px;height:36px;object-fit:contain}
.brand b{font-size:19px;display:block}.brand small{color:#C9D3F0;font-size:12px}
nav a{display:block;padding:11px 12px;border-radius:10px;color:#C9D3F0;text-decoration:none;font-size:15px}
nav a.on{background:var(--orange);color:var(--ink);font-weight:700}
nav a.soon{opacity:.5;pointer-events:none}
.me{margin-top:auto;padding:12px 10px 0;font-size:13px;color:#C9D3F0;border-top:1px solid #2a3c78}
.me button{margin-top:8px;min-height:44px;width:100%;border:1px solid #C9D3F0;background:transparent;color:#fff;border-radius:10px;font-weight:600;font-size:14px;font-family:inherit}
main{flex:999 1 560px;min-width:0;padding:28px 32px}
h1.t{margin:0 0 4px;font-size:28px}.sub{color:var(--mute);font-size:14px;margin-bottom:20px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:20px}
.card h2{margin:0 0 12px;font-size:18px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:640px}
th{text-align:left;color:var(--mute);font-weight:600;padding:10px 8px;border-bottom:1px solid var(--line)}
td{padding:12px 8px;border-bottom:1px solid #EEF1F6}
.chip{font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px;background:#E3F5EA;color:#0F6B3E}
.chip.o{background:#FFE8D1;color:#9A3412}
dl{display:grid;grid-template-columns:minmax(120px,200px) 1fr;gap:10px 16px;margin:0;font-size:14px}
dt{color:var(--mute)}dd{margin:0;font-weight:600}
.btn{min-height:44px;padding:0 18px;border:1px solid var(--blue);border-radius:10px;background:#fff;color:var(--blue);font-weight:600;font-size:14px;font-family:inherit;text-decoration:none;display:inline-flex;align-items:center}
.muted{color:var(--mute);font-size:13px}.err{color:#9B1C1C}
@media(max-width:700px){main{padding:18px 14px}nav{max-width:none}}
</style></head><body>
<div id="login">
  <div class="box">
    <img class="logo" src="logo.png" alt="" onerror="this.style.display='none'">
    <h1>Royal Sales HR</h1>
    <p>আপনার Google অ্যাকাউন্ট দিয়ে প্রবেশ করুন</p>
    <div id="gbtn"></div>
    <div id="lerr" role="alert"></div>
  </div>
</div>
<div id="app" class="hide">
  <nav aria-label="প্রধান মেনু">
    <div class="brand"><div class="lg"><img src="logo.png" alt="" onerror="this.style.display='none'"></div><div><b>Royal Sales</b><small>HR ও বেতন ব্যবস্থাপনা</small></div></div>
    <a class="soon" href="#">ড্যাশবোর্ড</a><a class="soon" href="#">হাজিরা</a>
    <a id="navEmp" href="#/employees">কর্মচারী</a>
    <a class="soon" href="#">ছুটি</a><a class="soon" href="#">বেতন</a><a class="soon" href="#">ঈদ বোনাস</a>
    <a class="soon" href="#">অগ্রিম ও ধার</a><a class="soon" href="#">নগদ হিসাব</a>
    <div class="me"><div id="meName"></div><div id="meRole"></div><button id="logout">লগআউট</button></div>
  </nav>
  <main id="view" aria-live="polite"></main>
</div>
<script>
// === Fill these two values (same as the test page) ===
const CLIENT_ID = '55018750857-l06mb2en1nflf3e56scfcm8psus7f8a5.apps.googleusercontent.com';
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzCtprsLK_LzquwhsNNSnQoyOCHm41Sb5WNZ7scl58fGWxl3sMQ1MJe4Vuw9waEe5rq/exec';
// =====================================================
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const bn = n => (n === null || n === undefined || n === '') ? '—' : '৳ ' + Number(n).toLocaleString('bn-BD');
const ROLE = {'Super Admin':'সুপার অ্যাডমিন','Owner':'মালিক','Admin':'অ্যাডমিন','Staff':'কর্মচারী'};
let ME = null;

// The server gives a 24-hour session after the Google login; it is kept in this browser.
function getToken(){ try{ const t=localStorage.getItem('rs_session'), x=Number(localStorage.getItem('rs_exp')); return t&&x>Date.now()?t:null; }catch(e){ return null; } }
function setToken(t){ try{ if(t){ localStorage.setItem('rs_session',t); localStorage.setItem('rs_exp',String(Date.now()+23.5*3600*1000)); } else { localStorage.removeItem('rs_session'); localStorage.removeItem('rs_exp'); } }catch(e){} }

async function api(action, params){
  const token = getToken();
  if(!token) throw new Error('NOT_LOGGED_IN');
  const r = await fetch(SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({session:token,action,params:params||{}})});
  const j = await r.json();
  if(!j.ok) throw new Error(j.error);
  return j.data;
}

function showLogin(msg){
  $('app').classList.add('hide'); $('login').classList.remove('hide');
  $('lerr').textContent = msg||'';
}
function logout(){
  setToken(null); ME=null;
  if(window.google&&google.accounts) google.accounts.id.disableAutoSelect();
  showLogin('');
}
$('logout').onclick = logout;

async function start(){
  try{
    ME = await api('me');
    $('meName').textContent = ME.name || ME.email;
    $('meRole').textContent = ROLE[ME.role] || ME.role;
    $('login').classList.add('hide'); $('app').classList.remove('hide');
    route();
  }catch(e){
    setToken(null);
    if(String(e.message).startsWith('NOT_ALLOWED')) showLogin('এই ইমেইল (' + e.message.split(':')[1] + ') দিয়ে প্রবেশের অনুমতি নেই। মালিকপক্ষের সঙ্গে যোগাযোগ করুন।');
    else showLogin(e.message==='NOT_LOGGED_IN'?'':'সমস্যা হয়েছে: '+e.message);
  }
}

async function onCred(resp){
  try{
    const r = await fetch(SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'login',idToken:resp.credential})});
    const j = await r.json();
    if(!j.ok) throw new Error(j.error);
    setToken(j.data.session); start();
  }catch(e){
    if(String(e.message).startsWith('NOT_ALLOWED')) showLogin('এই ইমেইল ('+e.message.split(':')[1]+') দিয়ে প্রবেশের অনুমতি নেই। মালিকপক্ষের সঙ্গে যোগাযোগ করুন।');
    else showLogin('সমস্যা হয়েছে: '+e.message);
  }
}
window.addEventListener('load',()=>{
  const t=setInterval(()=>{ if(window.google&&google.accounts){ clearInterval(t);
    google.accounts.id.initialize({client_id:CLIENT_ID,callback:onCred,auto_select:true});
    google.accounts.id.renderButton($('gbtn'),{theme:'outline',size:'large',text:'signin_with'});
    if(getToken()) start(); else google.accounts.id.prompt();
  }},150);
});

/* ---------- pages ---------- */
window.addEventListener('hashchange',()=>{ if(ME) route(); });
function route(){
  const h = location.hash || '#/employees';
  const m = h.match(/^#\/employee\/(.+)$/);
  $('navEmp').classList.add('on');
  if(m) profile(decodeURIComponent(m[1])); else employees();
}
const FRI = g => (g==='TRN'||g==='CCTV') ? 'ছুটি (বিকাল ৩:৩০ থেকে)' : 'কাজ করেন';
const BON = e => e==='Fixed' ? 'Fixed ৫০%' : e==='Discretionary' ? 'ইচ্ছামতো' : e==='None' ? 'নেই' : '—';

async function employees(){
  const v=$('view'); v.innerHTML='<p class="muted">লোড হচ্ছে...</p>';
  try{
    const rows = await api('employees.list');
    const sal = rows.length && rows[0].monthly_salary !== undefined;
    v.innerHTML = '<h1 class="t">কর্মচারী</h1><div class="sub">মোট '+rows.length+' জন</div><div class="card"><div class="tw"><table><thead><tr><th>ID</th><th>নাম</th><th>পদ</th><th>অবস্থা</th><th>শুক্রবার সকাল</th>'+(sal?'<th style="text-align:right">মাসিক বেতন</th>':'')+'<th>ঈদ বোনাস</th></tr></thead><tbody>'+
      rows.map(r=>'<tr><td class="muted">'+esc(r.employee_id)+'</td><td><a href="#/employee/'+encodeURIComponent(r.employee_id)+'" style="font-weight:700;text-decoration:none">'+esc(r.name_bn)+'</a></td><td>'+esc(r.designation)+'</td><td><span class="chip">'+esc(r.status)+'</span></td><td class="muted">'+FRI(r.shift_group_id)+'</td>'+(sal?'<td style="text-align:right;font-weight:600">'+bn(r.monthly_salary)+'</td>':'')+'<td class="muted">'+BON(r.eid_bonus_mode)+'</td></tr>').join('')+
      '</tbody></table></div>'+(sal?'<div class="muted" style="margin-top:12px">বেতনের ঘর শুধু অনুমতিপ্রাপ্তরা দেখতে পান।</div>':'')+'</div>';
  }catch(e){ fail(e); }
}

async function profile(id){
  const v=$('view'); v.innerHTML='<p class="muted">লোড হচ্ছে...</p>';
  try{
    const r = await api('employees.get',{id});
    const f=(k,val)=>'<dt>'+k+'</dt><dd>'+(val?esc(val):'<span class="muted">এখনও দেওয়া হয়নি</span>')+'</dd>';
    let h = '<p><a href="#/employees" class="btn">← কর্মচারী তালিকা</a></p><h1 class="t">'+esc(r.name_bn)+'</h1><div class="sub">'+esc(r.name_en)+' · '+esc(r.employee_id)+'</div>'+
      '<div class="card"><h2>সাধারণ তথ্য</h2><dl>'+f('পদ',r.designation)+f('অবস্থা',r.status)+f('যোগদানের তারিখ',r.joining_date)+f('চাকরির ধরন',r.employment_type)+f('মোবাইল',r.mobile)+f('ঠিকানা',r.address)+f('জরুরি যোগাযোগ',r.emergency_contact)+f('শুক্রবার সকাল',FRI(r.shift_group_id))+f('ঈদ বোনাস',BON(r.eid_bonus_mode))+(r.nid_number!==undefined?f('NID',r.nid_number):'')+'</dl></div>';
    if(r.salary_history){
      h += '<div class="card"><h2>বেতনের ইতিহাস</h2><div class="tw"><table><thead><tr><th>কার্যকর তারিখ</th><th style="text-align:right">মাসিক বেতন</th><th>কারণ</th></tr></thead><tbody>'+
        r.salary_history.map(s=>'<tr><td>'+(s.effective_from?esc(s.effective_from):'<span class="muted">তারিখ বসাতে হবে</span>')+'</td><td style="text-align:right;font-weight:600">'+bn(s.monthly_salary)+'</td><td class="muted">'+esc(s.reason)+'</td></tr>').join('')+'</tbody></table></div></div>';
    }
    v.innerHTML = h;
  }catch(e){ fail(e); }
}
function fail(e){
  if(e.message==='NOT_LOGGED_IN'||String(e.message).startsWith('NOT_ALLOWED')){ logout(); return; }
  $('view').innerHTML='<p class="err">'+(e.message==='NOT_PERMITTED'?'এই তথ্য দেখার অনুমতি আপনার নেই।':'সমস্যা: '+esc(e.message))+'</p>';
}
</script></body></html>
